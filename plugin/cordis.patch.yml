# 刻意留空。
#
# 本插件的启动图登记行不在这里，而在 profile 的补丁层：
#   ~\.dsh\profiles\<profile>\cordis.patch.yml
# 由 install.ps1 写入（带 managed 标记块，可被 -Remove 精确摘除）。
#
# 原因：bundle 层的补丁只在宿主启动时读一次，装完必须重启才见效；而 profile 补丁层是
# live 监听的，写进去立刻重算启动图，刷新页面就能看到。两处同时插同一个 id 会在下次
# 重启时产生两条同名入口（组合启动图时可能直接报错），所以这里保持空数组，只留一条路。
#
# dsh 要求包声明 dsh.bundle.patch 指向一个存在的补丁文件，故此文件必须保留。
[]
